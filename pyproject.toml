[project]
name = "incident-investigator"
version = "0.1.0"
description = "Agentic log investigation engine: reads server logs, forms hypotheses, tests them with tools, writes evidence-backed root-cause reports."
readme = "README.md"
authors = [
    { name = "ishwer dutt", email = "96070571+ishwerdutt@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "duckdb>=1.0,<2.0",
    "drain3>=0.9,<1.0",
    # LLM
    "openai>=1.30,<2.0",
    # CLI
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    # Utils
    "ulid-py>=1.1,<2.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
incident-investigator = "incident_investigator.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
